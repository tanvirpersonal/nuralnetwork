<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neural Core — Handwritten Digit Lab</title><style>
:root{--bg:#02050a;--cyan:#69e9ff;--pink:#ff67dd;--text:#e7f9ff;--muted:#75919a;--panel:rgba(6,13,22,.82);--line:rgba(120,225,245,.16)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;z-index:5}.brand{position:absolute;top:22px;left:26px}.k{font:9px ui-monospace,monospace;letter-spacing:.24em;color:var(--cyan)}h1{font-size:24px;letter-spacing:.08em;margin:7px 0}h1 span{color:var(--pink);font-weight:400}.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(16px);box-shadow:0 18px 55px #0008}.draw{position:absolute;left:25px;bottom:25px;width:285px;padding:15px}.title{font:700 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--cyan);margin-bottom:11px}.pad{width:100%;aspect-ratio:1;background:#010308;border:1px solid #24404a;border-radius:12px;position:relative;overflow:hidden}.pad canvas{width:100%;height:100%;cursor:crosshair}.pad:after{content:'28 × 28 INPUT';position:absolute;right:9px;top:8px;font:8px ui-monospace;color:#46616a;pointer-events:none}.buttons{display:flex;gap:7px;margin-top:10px}button{flex:1;padding:9px 7px;border:1px solid #28505d;border-radius:8px;background:#07131a;color:#dffaff;font:700 9px ui-monospace;cursor:pointer}button:hover{border-color:var(--cyan);background:#0b2029}button.main{background:linear-gradient(100deg,#124958,#32143a);border-color:#4da9b9}.result{position:absolute;right:25px;top:25px;width:235px;padding:15px}.digit{font-size:64px;line-height:1;text-align:center;font-weight:700;margin:4px 0;color:var(--cyan);text-shadow:0 0 28px #48dcff77}.confidence{text-align:center;font:10px ui-monospace;color:var(--muted);margin-bottom:12px}.bar{height:5px;background:#102027;border-radius:5px;overflow:hidden;margin:5px 0 8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.3s}.p{font:9px ui-monospace;color:#6f8991;display:flex;justify-content:space-between}.network{position:absolute;left:330px;right:285px;bottom:24px;padding:10px 13px;font:9px ui-monospace;color:#5d7881}.status{color:#74ffc0}.hint{position:absolute;right:27px;bottom:27px;text-align:right;font:9px/1.7 ui-monospace;color:#506a73}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:11px ui-monospace;color:#74dff2;letter-spacing:.15em}.hidden{display:none}@media(max-width:900px){.draw{width:235px}.result{width:190px}.network{left:275px;right:220px}}@media(max-width:680px){.brand{left:15px}.draw{left:15px;bottom:15px;width:220px}.result{right:15px;top:70px;width:175px}.network{display:none}.hint{display:none}}
</style></head><body><div id="loading" class="loading">LOADING NEURAL MODEL…</div><div id="ui"><div class="brand"><div class="k">COMPUTATIONAL VISION / MNIST</div><h1>NEURAL <span>CORE</span></h1></div><section class="panel draw"><div class="title">INPUT — DRAW A DIGIT</div><div class="pad"><canvas id="pad" width="280" height="280"></canvas></div><div class="buttons"><button id="clear">CLEAR</button><button id="recognize" class="main">RECOGNIZE</button></div></section><section class="panel result"><div class="title">IDENTIFICATION</div><div id="digit" class="digit">—</div><div id="confidence" class="confidence">DRAW SOMETHING</div><div id="probs"></div></section><div class="network"><span class="status">● LIVE</span> &nbsp; INPUT → FEATURE EXTRACTION → CLASSIFICATION &nbsp; | &nbsp; <span id="layerName">READY</span></div><div class="hint">DRAW WITH MOUSE / TOUCH<br>THE NETWORK ACTIVATES LAYER BY LAYER</div></div><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const pad=document.getElementById('pad'),ctx=pad.getContext('2d'),loading=document.getElementById('loading');ctx.fillStyle='#010308';ctx.fillRect(0,0,280,280);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=22;ctx.strokeStyle='#fff';let drawing=false,last=null;
function pos(e){const r=pad.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*280/r.width,y:(p.clientY-r.top)*280/r.height}}function start(e){drawing=true;last=pos(e);e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()}function end(){drawing=false}pad.addEventListener('mousedown',start);pad.addEventListener('mousemove',move);addEventListener('mouseup',end);pad.addEventListener('touchstart',start,{passive:false});pad.addEventListener('touchmove',move,{passive:false});pad.addEventListener('touchend',end);document.getElementById('clear').onclick=()=>{ctx.fillStyle='#010308';ctx.fillRect(0,0,280,280);document.getElementById('digit').textContent='—';document.getElementById('confidence').textContent='DRAW SOMETHING';document.getElementById('probs').innerHTML=''};
let model,layerModels=[];const net=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);cam.position.set(0,0,34);const ren=new THREE.WebGLRenderer({antialias:true,alpha:false});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setClearColor(0x02050a,1);document.body.prepend(ren.domElement);const root=new THREE.Group();net.add(root);let dots=[],links=[],groups=[];function makeVisual(){while(root.children.length)root.remove(root.children[0]);dots=[];links=[];groups=[];const sizes=[16,12,10,10,10],xs=[-11,-5.5,0,5.5,11];for(let l=0;l<sizes.length;l++){let g=[];for(let j=0;j<sizes[l];j++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,1),new THREE.MeshBasicMaterial({color:0x2b6070,transparent:true,opacity:.55}));m.position.set(xs[l],(j-(sizes[l]-1)/2)*.72,(Math.random()-.5)*2.5);root.add(m);g.push(m);dots.push(m)}groups.push(g)}for(let l=0;l<groups.length-1;l++)for(const a of groups[l])for(const b of groups[l+1]){const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.position,b.position]),new THREE.LineBasicMaterial({color:0x23515f,transparent:true,opacity:.055}));ln.userData={a,b};root.add(ln);links.push(ln)}}makeVisual();
function animate(){requestAnimationFrame(animate);root.rotation.y+=.001;root.rotation.x=Math.sin(Date.now()*.0003)*.025;ren.render(net,cam)}animate();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function preprocess(){const s=document.createElement('canvas');s.width=s.height=28;const c=s.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,28,28);c.drawImage(pad,0,0,28,28);const d=c.getImageData(0,0,28,28).data,a=new Float32Array(784);for(let i=0;i<784;i++)a[i]=d[i*4]/255;return tf.tensor4d(a,[1,28,28,1])}
function setLayerVisual(values){if(!values)return;const n=Math.min(values.length,dots.length);for(let i=0;i<dots.length;i++){const v=i<n?Math.max(0,Math.min(1,values[i])):0;dots[i].material.color.setHSL(.52-.42*v,.8,.25+.5*v);dots[i].scale.setScalar(.7+v*1.8)}links.forEach((e,i)=>e.material.opacity=.025+.05*Math.random())}
async function recognize(){if(!model)return;const x=preprocess();try{let preds=model.predict(x),data=await preds.data();let best=0;for(let i=1;i<data.length;i++)if(data[i]>data[best])best=i;document.getElementById('digit').textContent=best;document.getElementById('confidence').textContent=(data[best]*100).toFixed(1)+'% CONFIDENCE';let order=[...data.keys()].sort((a,b)=>data[b]-data[a]).slice(0,5);document.getElementById('probs').innerHTML=order.map(i=>'<div class="p"><span>'+i+'</span><span>'+Math.round(data[i]*100)+'%</span></div><div class="bar"><i style="width:'+(data[i]*100)+'%"></i></div>').join('');for(let i=0;i<layerModels.length;i++){document.getElementById('layerName').textContent='PROCESSING '+(i+1)+'/'+layerModels.length;let z=layerModels[i].predict(x);let vals=await tf.tidy(()=>{let q=z;if(q.shape.length>2)q=q.mean(q.shape.length===4?[1,2]:[1]);return q.flatten()}).data();setLayerVisual(Array.from(vals));z.dispose();await new Promise(r=>setTimeout(r,180))}document.getElementById('layerName').textContent='OUTPUT → '+best;x.dispose();preds.dispose()}catch(e){console.error(e);document.getElementById('confidence').textContent='MODEL ERROR'}}document.getElementById('recognize').onclick=recognize;
(async()=>{try{model=await tf.loadLayersModel('https://storage.googleapis.com/tfjs-models/tfjs/mnist_v1/model.json');const chosen=model.layers.filter(l=>l.outputShape&&l.outputShape.length).slice(0,5);layerModels=chosen.map(l=>tf.model({inputs:model.inputs,outputs:l.output}));loading.classList.add('hidden');document.getElementById('layerName').textContent='MODEL READY';}catch(e){loading.textContent='MODEL LOAD FAILED — CHECK INTERNET';console.error(e)}})();
</script></body></html>
