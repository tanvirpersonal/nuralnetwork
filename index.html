<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neural Network — 3D Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308;color:#dce8ef;font-family:Inter,system-ui,sans-serif}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:28px;top:24px}.mini{font:10px ui-monospace,monospace;letter-spacing:3px;color:#7b9aaa}.name{font-size:24px;font-weight:600;letter-spacing:2px;color:#f1f7fa;margin-top:5px}.name i{font-style:normal;color:#65d9ff}.sub{font:11px ui-monospace,monospace;color:#647986;margin-top:5px}
.panel{pointer-events:auto;position:absolute;background:rgba(5,9,14,.78);border:1px solid rgba(145,185,205,.15);box-shadow:0 18px 55px rgba(0,0,0,.35);backdrop-filter:blur(18px);border-radius:14px}.stats{right:25px;top:24px;padding:13px 16px;width:205px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055);padding:4px 0;font:10px ui-monospace,monospace;color:#70838e}.stat:last-child{border:0}.stat b{font-weight:500;color:#dcebf1}.live{color:#71efb2!important}
.controls{left:25px;bottom:25px;padding:15px 17px;width:290px}.ct{font:9px ui-monospace,monospace;letter-spacing:2px;color:#718894;margin-bottom:11px}.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:11px;color:#a8b8bf}.row label{width:78px}input{flex:1;accent-color:#65d9ff}output{width:48px;text-align:right;font:10px ui-monospace,monospace;color:#7bdfff}button{border:1px solid rgba(101,217,255,.25);background:rgba(101,217,255,.06);color:#ccebf4;padding:8px 11px;border-radius:7px;font-size:10px;cursor:pointer}button:hover{background:rgba(101,217,255,.13)}
.help{right:25px;bottom:28px;text-align:right;color:#536671;font:9px/1.8 ui-monospace,monospace}.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.2}.cross:before,.cross:after{content:'';position:absolute;background:#9bb6c1}.cross:before{width:1px;height:22px;left:10px}.cross:after{height:1px;width:22px;top:10px}
</style></head><body>
<div id="ui"><div class="top"><div class="mini">3D COMPUTATIONAL SYSTEM</div><div class="name">NEURAL <i>FIELD</i></div><div class="sub">LIVE SYNAPTIC VISUALIZATION</div></div><div class="panel stats">
<div class="stat"><span>CORE STATUS</span><b class="live">● ACTIVE</b></div><div class="stat"><span>LAYERS</span><b id="ls">5</b></div><div class="stat"><span>NEURONS</span><b id="ns">33</b></div><div class="stat"><span>SYNAPSES</span><b id="es">208</b></div><div class="stat"><span>SIGNALS / SEC</span><b id="ss">—</b></div></div>
<div class="panel controls"><div class="ct">SYSTEM PARAMETERS</div><div class="row"><label>Layers</label><input id="size" type="range" min="3" max="8" value="5"><output id="so">5</output></div><div class="row"><label>Neural activity</label><input id="act" type="range" min="0" max="100" value="62"><output id="ao">62%</output></div><div class="row"><label>Field speed</label><input id="spd" type="range" min="0" max="100" value="28"><output id="po">0.28x</output></div><div style="display:flex;gap:7px;margin-top:12px"><button id="sig">TRANSMIT SIGNAL</button><button id="rst">CENTER</button><button id="pause">PAUSE</button></div></div><div class="help">MOVE POINTER · SCROLL TO ZOOM<br>TRANSMISSION IS CONTINUOUS</div><div class="cross"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020308);scene.fog=new THREE.Fog(0x020308,48,145);const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);cam.position.set(0,0,48);
const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(r.domElement);
const field=new THREE.Group();scene.add(field);let layers=5,activity=.62,speed=.28,paused=false;let neurons=[],synapses=[],signals=[];
const counts=[4,7,10,9,3];function countsFor(n){if(n===5)return counts;return Array.from({length:n},(_,i)=>Math.max(3,Math.round(4+7*Math.sin(Math.PI*i/(n-1)))))}
function clear(){while(field.children.length)field.remove(field.children[0]);neurons=[];synapses=[];signals=[]}
function mat(c){return new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.65,roughness:.3,metalness:.15})}
function build(){clear();let cs=countsFor(layers),groups=[];const ng=new THREE.SphereGeometry(.42,20,20);cs.forEach((num,i)=>{let g=[],x=(i-(cs.length-1)/2)*8.5;for(let j=0;j<num;j++){let y=(j-(num-1)/2)*2.65,z=(Math.random()-.5)*5;let n=new THREE.Mesh(ng,mat(0x56c9e8));n.position.set(x,y,z);n.userData={x,y,z,p:Math.random()*6.28,a:Math.random()};field.add(n);g.push(n);neurons.push(n);let halo=new THREE.Mesh(new THREE.SphereGeometry(.72,14,14),new THREE.MeshBasicMaterial({color:0x4bc7e8,transparent:true,opacity:.045,blending:THREE.AdditiveBlending,depthWrite:false}));n.add(halo)}groups.push(g)});
for(let i=0;i<groups.length-1;i++)for(const a of groups[i])for(const b of groups[i+1]){let geo=new THREE.BufferGeometry().setFromPoints([a.position,b.position]);let line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x6b8290,transparent:true,opacity:.075}));line.userData={a,b,p:Math.random()*6.28};field.add(line);synapses.push(line)}document.getElementById('ls').textContent=layers;document.getElementById('ns').textContent=neurons.length;document.getElementById('es').textContent=synapses.length}
function signal(){if(!synapses.length)return;for(let k=0;k<3;k++){let e=synapses[(Math.random()*synapses.length)|0],m=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),mat(0xb9f5ff));m.userData={a:e.userData.a,b:e.userData.b,t:0,d:.55+Math.random()*.55};m.position.copy(m.userData.a.position);field.add(m);signals.push(m)}}
function update(t){field.rotation.y+=.0007*speed;field.rotation.x=Math.sin(t*.12)*.025;neurons.forEach(n=>{let q=Math.sin(t*(1.2+activity*2)+n.userData.p);n.position.y=n.userData.y+q*(.05+activity*.12);let hot=q>.68-activity*.8;n.material.emissive.set(hot?0x4de4ff:0x174b5d);n.material.emissiveIntensity=hot?1.8:.55;n.scale.setScalar(hot?1.14:1)});synapses.forEach(e=>{e.geometry.setFromPoints([e.userData.a.position,e.userData.b.position]);e.material.opacity=.035+activity*.09+Math.max(0,Math.sin(t*1.4+e.userData.p))*.025});for(let i=signals.length-1;i>=0;i--){let s=signals[i];s.userData.t+=.016/s.userData.d;if(s.userData.t>=1){field.remove(s);signals.splice(i,1);continue}s.position.lerpVectors(s.userData.a.position,s.userData.b.position,s.userData.t)}}
// subtle volumetric star field
let sg=new THREE.BufferGeometry(),arr=new Float32Array(1100*3);for(let i=0;i<arr.length;i+=3){arr[i]=(Math.random()-.5)*170;arr[i+1]=(Math.random()-.5)*120;arr[i+2]=(Math.random()-.5)*150}sg.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x8caab5,size:.035,transparent:true,opacity:.35})));
build();setInterval(()=>{if(!paused)signal();document.getElementById('ss').textContent=paused?'0':(3+Math.floor(Math.random()*8))},900);
document.getElementById('size').oninput=e=>{layers=+e.target.value;document.getElementById('so').textContent=layers;build()};document.getElementById('act').oninput=e=>{activity=e.target.value/100;document.getElementById('ao').textContent=e.target.value+'%'};document.getElementById('spd').oninput=e=>{speed=e.target.value/100;document.getElementById('po').textContent=speed.toFixed(2)+'x'};document.getElementById('sig').onclick=signal;document.getElementById('rst').onclick=()=>{cam.position.set(0,0,48);field.rotation.set(0,0,0)};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'RESUME':'PAUSE'};
let tx=0,ty=0;addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*4;ty=(e.clientY/innerHeight-.5)*2});addEventListener('wheel',e=>cam.position.z=THREE.MathUtils.clamp(cam.position.z+e.deltaY*.018,24,78));addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
const c=new THREE.Clock();function loop(){requestAnimationFrame(loop);if(!paused){let t=c.getElapsedTime();update(t);cam.position.x+=(tx-cam.position.x)*.015;cam.position.y+=(-ty-cam.position.y)*.015;r.render(scene,cam)}}loop();
</script></body></html>
