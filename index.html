<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic 3D Neural Network</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* Deep dark background */
        }
        canvas {
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
        }
        p {
            font-size: 0.9rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1>NEURAL NETWORK CORE</h1>
        <p>Active Processing</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, and Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015); // Adds depth/aesthetic fog

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Network Configuration
        const layers = [4, 8, 10, 8, 3]; // Number of nodes in each layer
        const layerDistance = 12;
        const nodeSpacing = 4;
        const networkGroup = new THREE.Group();
        scene.add(networkGroup);

        const allNodes = [];
        
        // Materials (Neon Cyan for nodes, Neon Magenta for lines)
        const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.25 });
        const nodeGeometry = new THREE.SphereGeometry(0.6, 16, 16);

        // 3. Create Nodes
        for (let i = 0; i < layers.length; i++) {
            const numNodes = layers[i];
            const layerNodes = [];
            const xPos = (i - (layers.length - 1) / 2) * layerDistance; // Center the network

            for (let j = 0; j < numNodes; j++) {
                const yPos = (j - (numNodes - 1) / 2) * nodeSpacing;
                const zPos = (Math.random() - 0.5) * 6; // Add a slight 3D scatter effect
                
                const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
                node.position.set(xPos, yPos, zPos);
                
                // Store initial position for floating animation
                node.userData = {
                    initialY: yPos,
                    randomOffset: Math.random() * Math.PI * 2
                };

                networkGroup.add(node);
                layerNodes.push(node);
            }
            allNodes.push(layerNodes);
        }

        // 4. Create Edges (Connections)
        for (let i = 0; i < allNodes.length - 1; i++) {
            const currentLayer = allNodes[i];
            const nextLayer = allNodes[i + 1];

            currentLayer.forEach(nodeA => {
                nextLayer.forEach(nodeB => {
                    const points = [nodeA.position, nodeB.position];
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, edgeMaterial);
                    networkGroup.add(line);
                });
            });
        }

        // 5. Add some floating background particles for aesthetics
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 500;
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i=0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.5
        });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // 6. Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate the entire network slowly
            networkGroup.rotation.y = elapsedTime * 0.1;
            networkGroup.rotation.x = Math.sin(elapsedTime * 0.2) * 0.1;

            // Rotate particles
            particles.rotation.y = elapsedTime * 0.05;

            // Make nodes float slightly
            allNodes.forEach(layer => {
                layer.forEach(node => {
                    node.position.y = node.userData.initialY + Math.sin(elapsedTime * 1.5 + node.userData.randomOffset) * 0.5;
                });
            });

            renderer.render(scene, camera);
        }
        animate();

        // 7. Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
